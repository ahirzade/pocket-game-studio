<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pocket Studio - Asset Creator</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial;overflow:hidden}
header{height:55px;background:#151d33;display:flex;align-items:center;justify-content:space-between;padding:8px;border-bottom:1px solid #34415d}
header strong{color:#92aaff;font-size:14px}
button,select{
 border:0;border-radius:8px;padding:10px;
 color:white;background:#647cff;font-size:12px
}
button.secondary{background:#293650}
button.active{background:#16a085}
input{max-width:100%}
#layout{height:calc(100dvh - 55px);display:flex}
#panel{width:155px;background:#121a2d;padding:8px;overflow:auto}
#view{flex:1;position:relative;min-width:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
.section{padding:8px 0;border-bottom:1px solid #293650}
h3{font-size:12px;margin:5px 0 8px}
select{width:100%;margin:4px 0;background:#26334c}
button{width:100%;margin:3px 0;cursor:pointer}
input[type=color]{width:100%;height:38px}
input[type=range]{width:100%}
.small{font-size:10px;color:#b6c3dc}
#selected{font-size:11px;overflow-wrap:anywhere;color:#91b6ff}
#tip{position:absolute;bottom:8px;left:8px;right:8px;padding:8px;background:#10182bcc;border-radius:8px;font-size:10px;pointer-events:none}
#message{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:9px;background:#18453a;border-radius:8px;display:none;font-size:12px}
@media(max-width:600px){
 #panel{width:120px;padding:5px}
 button,select{font-size:10px;padding:8px 3px}
 h3{font-size:11px}
}
</style>
</head>

<body>

<header>
<strong>🧰 Asset & Lighting Studio</strong>
<button onclick="saveProject()" style="width:auto">💾 Save</button>
</header>

<div id="layout">

<aside id="panel">

<div class="section">
<h3>🏗️ Create Asset</h3>

<select id="assetType">
<option value="house">House</option>
<option value="car">Car</option>
<option value="tree">Tree</option>
<option value="character">Character</option>
</select>

<select id="shape">
<option value="modern">Modern</option>
<option value="classic">Classic</option>
<option value="tall">Tall</option>
<option value="stylized">Stylized</option>
</select>

<button onclick="createAsset()">➕ Create</button>
</div>

<div class="section">
<h3>🖌️ Paint Selected Part</h3>
<div id="selected">No part selected</div>
<input type="color" id="paint" value="#6688ff" onchange="paintPart(this.value)">

<button onclick="setMaterial('matte')">Matte</button>
<button onclick="setMaterial('glossy')">Glossy</button>
<button onclick="setMaterial('metal')">Metal</button>
<button onclick="setMaterial('glass')">Glass look</button>
</div>

<div class="section">
<h3>🔧 Transform</h3>
<button onclick="rotatePart()">↻ Rotate</button>
<button onclick="scalePart()">↕ Scale</button>
<button onclick="deletePart()" style="background:#a63c4e">🗑 Delete part</button>
</div>

<div class="section">
<h3>☀️ Lighting</h3>
<label class="small">Sun intensity</label>
<input type="range" min="0" max="5" step="0.1" value="2"
oninput="sunPower(this.value)">

<label class="small">Ambient light</label>
<input type="range" min="0" max="3" step="0.1" value="1"
oninput="ambientPower(this.value)">

<label class="small">Sun angle</label>
<input type="range" min="0" max="360" value="45"
oninput="sunAngle(this.value)">

<button onclick="lightingPreset('day')">☀️ Day</button>
<button onclick="lightingPreset('sunset')">🌅 Sunset</button>
<button onclick="lightingPreset('night')">🌙 Night</button>
<button onclick="lightingPreset('studio')">🎬 Studio</button>
<button onclick="toggleShadows()">Shadow On/Off</button>
<button onclick="toggleFog()">Fog On/Off</button>
</div>

<div class="section">
<h3>📂 Project</h3>
<button class="secondary" onclick="loadProject()">Load</button>
<button class="secondary" onclick="exportProject()">Export JSON</button>
<button class="secondary" onclick="clearAssets()">Clear</button>
</div>

</aside>

<div id="view">
<canvas id="canvas"></canvas>
<div id="message"></div>
<div id="tip">Tap a part to select and paint. Drag empty space to rotate camera. Pinch to zoom.</div>
</div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const canvas=document.getElementById("canvas");
const view=document.getElementById("view");

let scene=new THREE.Scene();
scene.background=new THREE.Color("#8da7c6");

const camera=new THREE.PerspectiveCamera(55,1,0.1,500);
camera.position.set(8,7,10);

const renderer=new THREE.WebGLRenderer({
 canvas,antialias:true,powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1;

const hemi=new THREE.HemisphereLight("#ffffff","#647080",1);
hemi.name="STUDIO_HEMI";
scene.add(hemi);

const sun=new THREE.DirectionalLight("#fff1d8",2);
sun.name="STUDIO_SUN";
sun.position.set(8,12,5);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-20;
sun.shadow.camera.right=20;
sun.shadow.camera.top=20;
sun.shadow.camera.bottom=-20;
scene.add(sun);

const fill=new THREE.DirectionalLight("#b9d5ff",0.4);
fill.name="STUDIO_FILL";
fill.position.set(-8,5,-5);
scene.add(fill);

let ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:"#6e7882",roughness:1})
);
ground.name="STUDIO_GROUND";
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.02;
ground.receiveShadow=true;
scene.add(ground);

let grid=new THREE.GridHelper(100,100,"#71809a","#48566b");
grid.name="STUDIO_GRID";
grid.position.y=0.01;
scene.add(grid);

let selected=null;
let groups=[];
let dragging=false;
let rotatingCamera=false;
let previous={x:0,y:0};
let radius=16;
let angle=0.7;
let height=7;
let shadows=true;
let fog=false;

const ray=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
let offset=new THREE.Vector3();

function resize(){
 camera.aspect=view.clientWidth/view.clientHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(view.clientWidth,view.clientHeight,false);
}
window.addEventListener("resize",resize);
resize();

function cameraUpdate(){
 camera.position.set(
 Math.sin(angle)*radius,height,Math.cos(angle)*radius
 );
 camera.lookAt(0,1,0);
}
cameraUpdate();

function mat(color,rough=0.75,metal=0){
 return new THREE.MeshStandardMaterial({
 color,roughness:rough,metalness:metal
 });
}

function mesh(geometry,material,name){
 const m=new THREE.Mesh(geometry,material);
 m.name=name;
 m.castShadow=true;
 m.receiveShadow=true;
 return m;
}

function addGroup(name){
 const g=new THREE.Group();
 g.name=name;
 g.position.set(0,0,0);
 scene.add(g);
 groups.push(g);
 return g;
}

function createHouse(style){
 const g=addGroup("House");

 let width=style==="tall"?2:3;
 let height=style==="tall"?3:1.8;

 const wall1=mesh(
 new THREE.BoxGeometry(width,height,width),
 mat("#e3d4bd"),"Wall"
 );
 wall1.position.y=height/2;
 g.add(wall1);

 const roof=mesh(
 new THREE.ConeGeometry(width*0.8,1.2,4),
 mat("#914f46"),"Roof"
 );
 roof.position.y=height+0.6;
 roof.rotation.y=Math.PI/4;
 g.add(roof);

 const door=mesh(
 new THREE.BoxGeometry(0.55,1.15,0.08),
 mat("#573c2c"),"Door"
 );
 door.position.set(0,0.58,width/2+0.05);
 g.add(door);

 for(let x of [-0.75,0.75]){
  const window=mesh(
   new THREE.BoxGeometry(0.6,0.55,0.08),
   mat("#8ed1ed",0.2,0.15),"Window"
  );
  window.position.set(x,1.15,width/2+0.05);
  g.add(window);
 }

 const trim=mesh(
 new THREE.BoxGeometry(width+0.1,0.12,width+0.1),
 mat("#c6b79f"),"Foundation"
 );
 trim.position.y=0.08;
 g.add(trim);

 return g;
}

function createCar(style){
 const g=addGroup("Car");

 const body=mesh(
 new THREE.BoxGeometry(
 style==="tall"?2:2.4,
 0.55,
 style==="tall"?1.3:1.1
 ),
 mat("#cf3549",0.3,0.2),"Body"
 );
 body.position.y=0.65;
 g.add(body);

 const cabin=mesh(
 new THREE.BoxGeometry(1.2,0.6,0.9),
 mat("#90c6df",0.18,0.1),"Glass"
 );
 cabin.position.y=1.15;
 g.add(cabin);

 const wheelmat=mat("#16191e",0.9);
 const rim=mat("#aab5c0",0.25,0.8);

 for(let x of [-0.8,0.8]){
  for(let z of [-0.65,0.65]){
   const wheel=mesh(
   new THREE.CylinderGeometry(0.32,0.32,0.2,24),
   wheelmat,"Tyre");
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,0.32,z);
   g.add(wheel);

   const r=mesh(
   new THREE.CylinderGeometry(0.17,0.17,0.21,16),
   rim,"Rim");
   r.rotation.z=Math.PI/2;
   r.position.copy(wheel.position);
   g.add(r);
  }
 }
 return g;
}

function createTree(style){
 const g=addGroup("Tree");

 const trunk=mesh(
 new THREE.CylinderGeometry(
 style==="tall"?0.18:0.25,0.32,2,10
 ),
 mat("#79513a"),"Trunk"
 );
 trunk.position.y=1;
 g.add(trunk);

 if(style==="tall"){
  for(let i=0;i<4;i++){
   const leaves=mesh(
    new THREE.ConeGeometry(1.1,1.5,8),
    mat("#236e48"),"Leaves"
   );
   leaves.position.y=1.7+i*0.65;
   g.add(leaves);
  }
 }else{
  const leaves=mesh(
   new THREE.SphereGeometry(1.1,16,12),
   mat("#29834d"),"Leaves"
  );
  leaves.position.y=2.4;
  g.add(leaves);

  const leaves2=mesh(
   new THREE.SphereGeometry(0.8,12,10),
   mat("#46a362"),"Leaves"
  );
  leaves2.position.set(0.55,2.8,0.2);
  g.add(leaves2);
 }
 return g;
}

function createCharacter(style){
 const g=addGroup("Character");

 const skin=mat("#c99570");
 const clothes=mat("#3c72d9");
 const pants=mat("#27384f");
 const shoes=mat("#202329");

 const head=mesh(
 new THREE.SphereGeometry(style==="stylized"?0.42:0.35,20,16),
 skin,"Head"
 );
 head.position.y=2.65;
 g.add(head);

 const body=mesh(
 new THREE.BoxGeometry(0.75,1,0.4),
 clothes,"Torso"
 );
 body.position.y=1.75;
 g.add(body);

 const pelvis=mesh(
 new THREE.BoxGeometry(0.6,0.4,0.38),
 pants,"Pelvis"
 );
 pelvis.position.y=1.05;
 g.add(pelvis);

 for(let side of [-1,1]){
  const leg=mesh(
   new THREE.BoxGeometry(0.24,0.8,0.28),
   pants,"Leg"
  );
  leg.position.set(side*0.18,0.55,0);
  g.add(leg);

  const shoe=mesh(
   new THREE.BoxGeometry(0.28,0.16,0.4),
   shoes,"Shoe"
  );
  shoe.position.set(side*0.18,0.12,0.08);
  g.add(shoe);

  const arm=mesh(
   new THREE.CapsuleGeometry(0.12,0.55,4,8),
   skin,"Arm"
  );
  arm.position.set(side*0.5,1.72,0);
  arm.rotation.z=side*0.12;
  g.add(arm);
 }
 return g;
}

function createAsset(){
 const type=document.getElementById("assetType").value;
 const style=document.getElementById("shape").value;

 let g;

 if(type==="house")g=createHouse(style);
 if(type==="car")g=createCar(style);
 if(type==="tree")g=createTree(style);
 if(type==="character")g=createCharacter(style);

 if(g){
  selectPart(g.children[0]);
  message(type+" created!");
 }
}

function selectPart(part){
 selected=part;
 document.getElementById("selected").textContent=
 part?part.name:"Nothing selected";

 if(part&&part.material&&part.material.color){
  document.getElementById("paint").value=
  "#"+part.material.color.getHexString();
 }
}

function paintPart(color){
 if(!selected)return;

 selected.traverse?.(()=>{});

 if(selected.material&&selected.material.color){
  selected.material.color.set(color);
 }
}

function setMaterial(type){
 if(!selected||!selected.material)return;

 const m=selected.material;

 if(type==="matte"){
  m.roughness=0.95;m.metalness=0;
 }
 if(type==="glossy"){
  m.roughness=0.15;m.metalness=0.1;
 }
 if(type==="metal"){
  m.roughness=0.25;m.metalness=0.9;
 }
 if(type==="glass"){
  m.roughness=0.08;m.metalness=0.2;
  m.transparent=true;m.opacity=0.65;
 }

 m.needsUpdate=true;
 message(type+" material applied");
}

function rotatePart(){
 if(selected)selected.rotation.y+=Math.PI/4;
}

function scalePart(){
 if(selected)selected.scale.multiplyScalar(1.15);
}

function deletePart(){
 if(!selected)return;

 const parent=selected.parent;
 parent.remove(selected);

 if(parent.children.length===0&&groups.includes(parent)){
  scene.remove(parent);
  groups=groups.filter(g=>g!==parent);
 }

 selectPart(null);
}

function sunPower(v){sun.intensity=Number(v)}
function ambientPower(v){hemi.intensity=Number(v)}

function sunAngle(v){
 const a=Number(v)*Math.PI/180;
 sun.position.set(Math.sin(a)*15,Math.max(1,Math.cos(a)*15),5);
}

function lightingPreset(type){
 if(type==="day"){
  scene.background.set("#8db8e5");
  sun.color.set("#fff2d6");
  sun.intensity=2.5;
  hemi.intensity=1.25;
  renderer.toneMappingExposure=1;
 }
 if(type==="sunset"){
  scene.background.set("#e88b66");
  sun.color.set("#ff9b58");
  sun.intensity=2;
  hemi.color.set("#ffcc9a");
  hemi.intensity=0.8;
  renderer.toneMappingExposure=1.1;
 }
 if(type==="night"){
  scene.background.set("#10152c");
  sun.color.set("#7899ff");
  sun.intensity=0.3;
  hemi.color.set("#7d8fff");
  hemi.intensity=0.5;
  renderer.toneMappingExposure=0.8;
 }
 if(type==="studio"){
  scene.background.set("#555e70");
  sun.color.set("#ffffff");
  sun.intensity=3;
  hemi.color.set("#ffffff");
  hemi.intensity=1.5;
  renderer.toneMappingExposure=1.2;
 }
 message(type+" lighting preset");
}

function toggleShadows(){
 shadows=!shadows;
 renderer.shadowMap.enabled=shadows;
 sun.castShadow=shadows;
 groups.forEach(g=>g.traverse(o=>{
  if(o.isMesh)o.castShadow=shadows;
 }));
 message("Shadows "+(shadows?"ON":"OFF"));
}

function toggleFog(){
 fog=!fog;
 scene.fog=fog?new THREE.Fog("#91a8c3",10,60):null;
 message("Fog "+(fog?"ON":"OFF"));
}

function saveProject(){
 try{
  localStorage.setItem("pocket_asset_scene",JSON.stringify(scene.toJSON()));
  message("Scene saved on this device!");
 }catch(e){
  message("Save failed!");
 }
}

function loadProject(){
 const raw=localStorage.getItem("pocket_asset_scene");
 if(!raw){message("No saved scene!");return;}

 try{
  const loader=new THREE.ObjectLoader();
  scene=loader.parse(JSON.parse(raw));

  groups=[];
  scene.children.forEach(o=>{
   if(["House","Car","Tree","Character"].includes(o.name))
    groups.push(o);
  });

  sun=scene.getObjectByName("STUDIO_SUN");
  hemi=scene.getObjectByName("STUDIO_HEMI");
  fill=scene.getObjectByName("STUDIO_FILL");

  selectPart(null);
  message("Project loaded!");
 }catch(e){
  message("Load failed!");
 }
}

function exportProject(){
 const data=JSON.stringify(scene.toJSON(),null,2);
 const blob=new Blob([data],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="pocket-studio-scene.json";
 a.click();
 URL.revokeObjectURL(url);
 message("Scene exported");
}

function clearAssets(){
 if(!confirm("Delete all assets?"))return;

 groups.forEach(g=>scene.remove(g));
 groups=[];
 selectPart(null);
 message("All assets cleared");
}

function message(text){
 const el=document.getElementById("message");
 el.textContent=text;
 el.style.display="block";
 setTimeout(()=>el.style.display="none",1800);
}

function pick(event){
 const rect=canvas.getBoundingClientRect();
 pointer.x=(event.clientX-rect.left)/rect.width*2-1;
 pointer.y=-(event.clientY-rect.top)/rect.height*2+1;
 ray.setFromCamera(pointer,camera);

 const hits=ray.intersectObjects(groups,true);
 if(hits.length)return hits[0].object;

 return null;
}

let movePlanePoint=new THREE.Vector3();

canvas.addEventListener("pointerdown",event=>{
 canvas.setPointerCapture(event.pointerId);
 previous={x:event.clientX,y:event.clientY};

 const hit=pick(event);

 if(hit){
  selectPart(hit);
  dragging=true;

  ray.ray.intersectPlane(groundPlane,movePlanePoint);
 }else{
  rotatingCamera=true;
 }
});

canvas.addEventListener("pointermove",event=>{
 const dx=event.clientX-previous.x;
 const dy=event.clientY-previous.y;
 previous={x:event.clientX,y:event.clientY};

 if(rotatingCamera){
  angle-=dx*0.008;
  height=Math.max(1,height+dy*0.035);
  cameraUpdate();
 }
});

canvas.addEventListener("pointerup",()=>{
 dragging=false;
 rotatingCamera=false;
});

canvas.addEventListener("wheel",event=>{
 radius=Math.max(4,Math.min(60,radius+event.deltaY*0.01));
 cameraUpdate();
},{passive:true});

canvas.addEventListener("dblclick",()=>{
 if(selected){
  selected.rotation.y+=Math.PI/2;
 }
});

function animate(){
 requestAnimationFrame(animate);
 renderer.render(scene,camera);
}
animate();

window.createAsset=createAsset;
window.paintPart=paintPart;
window.setMaterial=setMaterial;
window.rotatePart=rotatePart;
window.scalePart=scalePart;
window.deletePart=deletePart;
window.sunPower=sunPower;
window.ambientPower=ambientPower;
window.sunAngle=sunAngle;
window.lightingPreset=lightingPreset;
window.toggleShadows=toggleShadows;
window.toggleFog=toggleFog;
window.saveProject=saveProject;
window.loadProject=loadProject;
window.exportProject=exportProject;
window.clearAssets=clearAssets;

message("Asset Studio Ready");

</script>
</body>
</html>
